[workspace]
members = ["crates/flashloan-core", "crates/flashloan-daemon", "crates/flashloan-scan"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloy = { version = "=2.1.1", default-features = false, features = ["std", "sol-types"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
